[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agroute"
dynamic = ["version"]
description = "Configurable local agent router across Codex, Claude Code, and Antigravity with native usage-limit filtering and howhard integration."
keywords = [
  "coding-agents",
  "claude-code",
  "codex",
  "antigravity",
  "agent-router",
  "howhard",
  "rate-limits",
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=8.2,<9"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1.2", "twine>=5"]
docs = ["sphinx>=8", "myst-parser>=4", "furo"]

[project.scripts]
agroute = "agroute.cli:main"

[project.urls]
Homepage = "https://github.com/xu-hao/agroute"
Repository = "https://github.com/xu-hao/agroute"
Issues = "https://github.com/xu-hao/agroute/issues"
Changelog = "https://github.com/xu-hao/agroute/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "agroute.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agroute = ["py.typed", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
