  <g fill="#000000">
    <circle cx="256" cy="432" r="22"/>
    <circle cx="128" cy="248" r="22"/>
    <circle cx="256" cy="232" r="22"/>
    <circle cx="384" cy="248" r="22"/>
    <circle cx="192" cy="96" r="22"/>
